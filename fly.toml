app = "psiquiatria-regis-braga"
primary_region = "gru"

[build]

[env]
  HOST = "0.0.0.0"
  APP_MODE = "remote"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
